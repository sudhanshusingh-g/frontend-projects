<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A restricted text area that limits the number of characters a user can input."
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Restricted text area</title>
  </head>
  <body>
    <main>
      <section class="textarea-card">
        <textarea
          id="restricted-textarea"
          rows="10"
          cols="50"
          placeholder="Enter your text here..."
        ></textarea>
        <p id="char-count" aria-live="polite">0 / 250</p>
      </section>
    </main>
    <script src="index.js"></script>
  </body>
</html>
