<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple date picker component for selecting dates.">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Date Picker</title>
</head>
<body>
    <main>
        <p>Date Picker</p>
        <!-- Date Picker component -->
         <div class="date-picker">
            <label for="date-label">Pick a date</label>
            <input type="text" id="date-picker-input" name="date-picker" aria-label="Pick a date" placeholder="dd/mm/yyyy">
            <i class="fa fa-calendar"></i>
            <div class="calendar">
                <!-- Header -->
                <div class="calendar-header">
                    <button class="prev-month">&lt;</button>
                    <h3 class="current-month">August</h3>
                    <button class="next-month">&gt;</button>
                </div>
                <!-- Grid -->
                <div class="calendar-grid">
                    <!-- Days of the week -->
                    <div class="day-of-week">Sun</div>
                    <div class="day-of-week">Mon</div>
                    <div class="day-of-week">Tue</div>
                    <div class="day-of-week">Wed</div>
                    <div class="day-of-week">Thu</div>
                    <div class="day-of-week">Fri</div>
                    <div class="day-of-week">Sat</div>
                    <!-- Dates -->
                     <div class="day">1</div>
                     <div class="day">2</div>
                     <div class="day">3</div>
                     <div class="day">4</div>
                     <div class="day">5</div>
                     <div class="day">6</div>
                     <div class="day">7</div>
                     <div class="day">8</div>
                     <div class="day">9</div>
                     <div class="day">10</div>
                     <div class="day">11</div>
                     <div class="day">12</div>
                     <div class="day">13</div>
                     <div class="day">14</div>
                     <div class="day">15</div>
                     <div class="day">16</div>
                     <div class="day">17</div>
                     <div class="day">18</div>
                     <div class="day">19</div>
                     <div class="day">20</div>
                     <div class="day">21</div>
                     <div class="day">22</div>
                     <div class="day">23</div>
                     <div class="day">24</div>
                     <div class="day">25</div>
                     <div class="day">26</div>
                     <div class="day">27</div>
                     <div class="day">28</div>
                     <div class="day">29</div>
                     <div class="day">30</div>
                     <div class="day">31</div>
                </div>
            </div>
         </div>
    </main>
</body>
</html>
