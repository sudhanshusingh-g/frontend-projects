<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cookie Consent Popup</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-content">
      <h1>Welcome to Our Website</h1>
      <p>Demo page content behind the popup.</p>
    </main>

    <div
      id="cookie-popup"
      class="cookie-popup"
      role="dialog"
      aria-live="polite"
      aria-label="Cookie consent"
    >
      <button
        id="close-cookies"
        class="icon-btn close-btn"
        type="button"
        aria-label="Close cookie popup"
      >
        ×
      </button>
      <div class="cookie-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" role="img" aria-hidden="true">
          <circle cx="32" cy="32" r="28" fill="#fff"></circle>
          <circle cx="20" cy="18" r="4" fill="#000"></circle>
          <circle cx="28" cy="13" r="3" fill="#000"></circle>
          <circle cx="40" cy="17" r="4" fill="#000"></circle>
          <circle cx="47" cy="27" r="3" fill="#000"></circle>
          <circle cx="19" cy="31" r="3" fill="#000"></circle>
          <circle cx="27" cy="42" r="4" fill="#000"></circle>
          <circle cx="42" cy="41" r="3" fill="#000"></circle>
          <circle cx="36" cy="30" r="3" fill="#000"></circle>
        </svg>
      </div>
      <p class="cookie-message">
        We use cookies to improve your user experience.
      </p>
      <button id="accept-cookies" class="accept-btn" type="button">
        I like Cookies
      </button>
    </div>

    <script src="index.js"></script>
  </body>
</html>
