<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Custom Dropdown</title>
    <style>
      :root {
        --bg: #fff;
        --border: #ddd;
        --accent: #0b74de;
        --muted: #6b6b6b;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          Inter,
          system-ui,
          Segoe UI,
          Roboto,
          Arial;
        background: #f6f7fb;
        padding: 24px;
      }
      .card {
        width: 320px;
        background: var(--bg);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 6px 20px rgba(20, 30, 50, 0.06);
      }
      h1 {
        font-size: 18px;
        margin: 0 0 12px;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 13px;
      }

      .dropdown {
        position: relative;
      }
      .dropdown-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: white;
        cursor: pointer;
      }
      .dropdown-toggle:focus {
        outline: 2px solid rgba(11, 116, 222, 0.18);
        outline-offset: 2px;
      }
      .label {
        color: #111;
      }
      .label.placeholder {
        color: var(--muted);
      }
      .arrow {
        transition: transform 0.14s ease;
        opacity: 0.85;
      }
      .arrow.open {
        transform: rotate(180deg);
      }

      .options {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 8px);
        background: white;
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(20, 30, 50, 0.08);
        max-height: 220px;
        overflow: auto;
        display: none;
        padding: 6px;
      }
      .options.open {
        display: block;
      }
      .option {
        padding: 10px 12px;
        border-radius: 8px;
        cursor: pointer;
        color: #111;
      }
      .option + .option {
        margin-top: 6px;
      }
      .option:hover,
      .option.focused {
        background: #f0f6ff;
      }
      .option.selected {
        background: linear-gradient(
          90deg,
          rgba(11, 116, 222, 0.08),
          rgba(11, 116, 222, 0.02)
        );
        border: 1px solid rgba(11, 116, 222, 0.12);
        font-weight: 600;
      }

      .footnote {
        margin-top: 12px;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Custom Dropdown</h1>
      <p>This project lets you practice DOM manipulation and event handling.</p>

      <div class="dropdown" id="customDropdown">
        <button
          type="button"
          class="dropdown-toggle"
          id="ddToggle"
          aria-haspopup="listbox"
          aria-expanded="false"
        >
          <span class="label placeholder">Select an option</span>
          <svg
            class="arrow"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M6 9l6 6 6-6"
              stroke="#111"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

        <div
          class="options"
          id="ddOptions"
          role="listbox"
          tabindex="-1"
          aria-labelledby="ddToggle"
        >
          <div class="option" data-value="apple" role="option">Apple</div>
          <div class="option" data-value="banana" role="option">Banana</div>
          <div class="option" data-value="cherry" role="option">Cherry</div>
          <div class="option" data-value="date" role="option">Date</div>
          <div class="option" data-value="elderberry" role="option">
            Elderberry
          </div>
        </div>
      </div>

      <div class="footnote">
        Click the dropdown, choose an item — it will close and highlight the
        selection.
      </div>
    </div>

    <script>
      (function () {
        const root = document.getElementById("customDropdown");
        const toggle = document.getElementById("ddToggle");
        const options = document.getElementById("ddOptions");
        const items = Array.from(options.querySelectorAll(".option"));
        let open = false;
        let focusedIndex = -1;
        let selectedIndex = -1;

        function setOpen(next) {
          open = next;
          options.classList.toggle("open", open);
          toggle.setAttribute("aria-expanded", String(open));
          toggle.querySelector(".arrow").classList.toggle("open", open);
          if (open) {
            options.focus();
          }
          if (!open) {
            clearFocus();
          }
        }

        function clearFocus() {
          items.forEach((i) => i.classList.remove("focused"));
          focusedIndex = -1;
        }

        function focusIndex(i) {
          if (i < 0) i = items.length - 1;
          if (i >= items.length) i = 0;
          clearFocus();
          focusedIndex = i;
          const el = items[i];
          el.classList.add("focused");
          el.scrollIntoView({ block: "nearest" });
        }

        function selectIndex(i) {
          if (i < 0 || i >= items.length) return;
          items.forEach((it) => it.classList.remove("selected"));
          const el = items[i];
          el.classList.add("selected");
          selectedIndex = i;
          const label = toggle.querySelector(".label");
          label.textContent = el.textContent;
          label.classList.remove("placeholder");
          setOpen(false);
        }

        toggle.addEventListener("click", (e) => {
          setOpen(!open);
        });

        items.forEach((it, idx) => {
          it.addEventListener("click", (e) => selectIndex(idx));
        });

        // Close when clicking outside
        document.addEventListener("click", (e) => {
          if (!root.contains(e.target)) setOpen(false);
        });

        // Keyboard support
        toggle.addEventListener("keydown", (e) => {
          if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            e.preventDefault();
            setOpen(true);
            focusIndex(e.key === "ArrowDown" ? 0 : items.length - 1);
          } else if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            setOpen(!open);
          }
        });

        options.addEventListener("keydown", (e) => {
          if (e.key === "ArrowDown") {
            e.preventDefault();
            focusIndex(focusedIndex + 1);
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            focusIndex(focusedIndex - 1);
          } else if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            if (focusedIndex >= 0) selectIndex(focusedIndex);
          } else if (e.key === "Escape") {
            e.preventDefault();
            setOpen(false);
            toggle.focus();
          }
        });

        // Expose simple API (optional)
        root.selectValue = () => items[selectedIndex]?.dataset?.value ?? null;
      })();
    </script>
  </body>
</html>
